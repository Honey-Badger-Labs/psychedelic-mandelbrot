# Renders films with their soundtracks. Start it by hand from the Actions tab ("Film" > "Run workflow");
# the films appear under the run's Artifacts.
#   set = every: one film per fractal, rendered side by side, plus psychedelic-all.mp4 joining the five
#   with the same dissolves as the tour. Or name one set (mandelbrot, julia, ship, bulb, buddha).
# Frames are rendered one at a time in software, not in real time: a deep full-HD Mandelbrot frame takes 30+ s,
# so whole journeys at full size do not fit the six-hour limit. For the films, use the Rec button on a computer
# with a graphics card (see README). This workflow suits short clips. Each job may run up to six hours:
# if a deep set does not finish, lower fps or scale (scale 0.75 is about twice as quick).
name: Film
on:
  workflow_dispatch:
    inputs:
      set: { description: "every, or one of mandelbrot, julia, ship, bulb, buddha", default: "every" }
      width: { description: "Width in pixels", default: "1920" }
      height: { description: "Height in pixels (1080 x 1920 for a vertical clip)", default: "1080" }
      fps: { description: "Frames per second", default: "30" }
      from: { description: "First stage number (one set only)", default: "0" }
      to: { description: "Last stage number, blank for a full loop (one set only)", default: "" }
      clean: { description: "No text, only the picture", type: boolean, default: false }
      scale: { description: "Render resolution, as a fraction of the frame", default: "1" }
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(inputs.set == 'every' && '["mandelbrot","julia","ship","bulb","buddha"]' || format('["{0}"]', inputs.set)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright-core@1.47.2 @fontsource/cormorant-garamond @fontsource/ibm-plex-mono
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Render
        run: |
          python3 -m http.server 8765 >/dev/null 2>&1 &
          sleep 2
          FROM="${{ inputs.set == 'every' && '0' || inputs.from }}"
          TO="${{ inputs.set == 'every' && '' || inputs.to }}"
          node tools/film.mjs --set "${{ matrix.set }}" --out "psychedelic-${{ matrix.set }}.mp4" \
            --width ${{ inputs.width }} --height ${{ inputs.height }} --fps ${{ inputs.fps }} \
            --from $FROM ${TO:+--to $TO} --scale ${{ inputs.scale }} \
            ${{ inputs.clean && '--clean' || '' }} --chrome "$(which google-chrome)"
      - uses: actions/upload-artifact@v4
        with:
          name: psychedelic-${{ matrix.set }}-${{ inputs.width }}x${{ inputs.height }}
          path: |
            psychedelic-${{ matrix.set }}.mp4
            psychedelic-${{ matrix.set }}.mp4.json
          compression-level: 0
          retention-days: 30
  join:
    needs: film
    if: inputs.set == 'every'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - uses: actions/download-artifact@v4
        with: { path: films, merge-multiple: true }
      - run: |
          node tools/join.mjs --out psychedelic-all.mp4 --fade 4 \
            films/psychedelic-mandelbrot.mp4 films/psychedelic-julia.mp4 films/psychedelic-ship.mp4 \
            films/psychedelic-bulb.mp4 films/psychedelic-buddha.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: psychedelic-all-${{ inputs.width }}x${{ inputs.height }}
          path: psychedelic-all.mp4
          compression-level: 0
          retention-days: 30
