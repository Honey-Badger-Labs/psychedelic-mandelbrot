<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Psychedelic Mandelbrot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2306030f%27/%3E%3Ccircle cx=%2719%27 cy=%2716%27 r=%278%27 fill=%27%23ff3fb4%27/%3E%3Ccircle cx=%279%27 cy=%2716%27 r=%273.5%27 fill=%27%2338e8ff%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed fractal canvas; one instrument strip pinned to the bottom. Single dark theme by choice. */
  color-scheme: dark;
  --void:#06030f;
  --ink:#f1ecf7;
  --dim:#9c95ad;
  --line:rgba(241,236,247,.18);
  --hot:#ff4fb8;
  --exact:#5ff0ff;
  --computed:#b6ff6a;
  --art:#ff7ad9;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--mono);font-size:12px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.mark{position:fixed;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;letter-spacing:.18em;text-transform:uppercase;font-size:10px;color:var(--dim);pointer-events:none}
.mark b{color:var(--ink);font-weight:500}
.mark,.depth{z-index:2;text-shadow:0 0 2px rgba(6,3,15,.95),0 0 8px rgba(6,3,15,.85),0 1px 20px rgba(6,3,15,.7)}
.mark::before{content:"";position:fixed;left:0;top:0;width:100%;height:170px;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 480px 170px at 0 0,rgba(6,3,15,.8) 0%,rgba(6,3,15,.6) 35%,rgba(6,3,15,.25) 70%,rgba(6,3,15,0) 100%)}
/* the depth gauge: how far in we are, and how hard the set is working */
.depth{position:fixed;top:36px;left:16px;right:16px;display:flex;flex-direction:column;gap:2px;pointer-events:none}
#mag{color:var(--ink);font-size:12px;letter-spacing:.04em;font-variant-numeric:tabular-nums}
#iters{color:#b9b1cc;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
#where{color:var(--ink);font-size:11px;opacity:.75;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.mark span,.depth span{white-space:nowrap}
.hud{position:fixed;left:0;right:0;bottom:0;padding:90px 16px 16px;background:linear-gradient(to top,rgba(6,3,15,.9) 0%,rgba(6,3,15,.8) 18%,rgba(6,3,15,.58) 38%,rgba(6,3,15,.34) 58%,rgba(6,3,15,.14) 76%,rgba(6,3,15,0) 100%);display:flex;flex-direction:column;gap:12px}
.inner{width:100%;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.read{display:flex;flex-direction:column;justify-content:flex-start;gap:6px;--ease:cubic-bezier(.16,1,.3,1)}
.measure{position:absolute;left:0;right:0;top:0;visibility:hidden;pointer-events:none}
/* text arrives after the dive settles: heading first, then place and depth, label, note, sources */
.w{display:inline-block;white-space:nowrap}
.c{display:inline-block;opacity:0;filter:blur(12px);transform:translate(var(--dx),var(--dy)) scale(1.8);
  transition:opacity 1.6s var(--ease),filter 1.8s var(--ease),transform 2.2s var(--ease);transition-delay:calc(var(--i)*70ms)}
.read.in .c{opacity:1;filter:blur(0);transform:none}
.read.out .c{opacity:0;filter:blur(10px);transform:translate(calc(var(--dx)*-1.6),calc(var(--dy)*-1.6)) scale(.5);
  transition-duration:1s;transition-timing-function:ease-in;transition-delay:calc(.5s + var(--r)*.5s)}
.meta{opacity:0;filter:blur(6px);transform:translateY(.6em);transition:opacity 1.4s var(--ease),filter 1.6s var(--ease),transform 1.8s var(--ease);transition-delay:var(--meta-at,1.6s)}
.read.in .meta{opacity:1;filter:blur(0);transform:none}
.read.out .meta{opacity:0;transition-duration:.7s;transition-delay:.3s}
.chip{clip-path:inset(0 100% 0 0);transition:clip-path 1.2s var(--ease);transition-delay:var(--chip-at,2.2s)}
.read.in .chip{clip-path:inset(0 0 0 0)}
.read.out .chip{clip-path:inset(0 0 0 100%);transition-duration:.6s;transition-delay:.4s}
.nw{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(.5em);
  transition:opacity 1.2s var(--ease),filter 1.2s var(--ease),transform 1.4s var(--ease);transition-delay:calc(var(--note-at,2.8s) + var(--i)*75ms)}
.read.in .nw{opacity:1;filter:blur(0);transform:none}
.read.out .nw{opacity:0;filter:blur(6px);transition-duration:.6s;transition-delay:0s}
.src{opacity:0;transition:opacity 1.2s ease}
.read.in .src{opacity:1;transition-delay:var(--src-at,5s)}
.read.out .src{opacity:0;transition-duration:.4s;transition-delay:0s}
@media (prefers-reduced-motion:reduce){
  .c,.nw,.meta,.chip,.src{filter:none!important;transform:none!important;clip-path:none!important;transition:opacity .3s!important}
}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
/* the title carries the current palette, flowing slowly */
h1{font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(28px,5.4vw,44px);line-height:1.05;margin:0;text-wrap:balance;
  background:linear-gradient(90deg,var(--p0,#ff4fb8),var(--p1,#ffd34f),var(--p2,#5ff0ff),var(--p0,#ff4fb8));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 14s linear infinite}
h1 .c{color:transparent}
@keyframes flow{to{background-position:300% 0}}
@media (prefers-reduced-motion:reduce){h1{animation:none}}
.chip{border:1px solid currentColor;border-radius:2px;padding:2px 7px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.chip.exact{color:var(--exact)}
.chip.computed{color:var(--computed)}
.chip.art{color:var(--art)}
.meta{color:var(--dim)}
.meta span{color:var(--ink)}
.note{margin:0;max-width:62ch;color:var(--dim)}
.ctl{display:flex;align-items:center;gap:12px}
button{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:2px;padding:9px 12px;min-width:68px;cursor:pointer;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
button:hover{border-color:var(--hot);color:var(--hot)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hot);outline-offset:3px}
.track{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--line)}
input[type=range]::-moz-range-track{height:1px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--hot);margin-top:-9px;box-shadow:0 0 18px rgba(255,79,184,.8)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:var(--hot);box-shadow:0 0 18px rgba(255,79,184,.8)}
.ticks{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.ticks i{font-style:normal}
.src{margin:0;font-size:10px;letter-spacing:.04em;color:var(--dim)}
.src a{color:var(--dim);text-decoration:underline;text-underline-offset:2px}
.src a:hover{color:var(--hot)}
.fail{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
/* the set picker: one word per family, the current one lit */
.sets{position:fixed;top:12px;right:16px;display:flex;gap:4px;z-index:3;flex-wrap:wrap;justify-content:flex-end}
.sets button{min-width:0;padding:5px 9px;font-size:9px;border-color:transparent;color:var(--dim);text-shadow:0 0 6px rgba(6,3,15,.9)}
.sets button[aria-pressed="true"]{color:var(--ink);border-color:var(--line);background:rgba(6,3,15,.45)}
#fps{position:fixed;top:44px;right:16px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);pointer-events:none;z-index:2;opacity:.7}
#rec.on{color:#ff4d5e;border-color:#ff4d5e}
#rec.on::before{content:"● ";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(420px,90vw);padding:14px 16px;background:rgba(6,3,15,.92);border:1px solid var(--line);border-radius:2px;z-index:5;display:none;gap:10px;flex-direction:column}
.toast.show{display:flex}
.toast video{max-width:100%;border:1px solid var(--line)}
.toast a{color:var(--hot)}
.toast .row{justify-content:flex-end}
/* no-text mode: only the picture. Controls come back while the pointer moves */
body.clean .read,body.clean .mark,body.clean .depth,body.clean #fps{opacity:0;pointer-events:none;transition:opacity .8s}
body.clean .hud{background:none}
body.clean .ctl,body.clean .sets{transition:opacity .8s}
body.clean.idle .ctl,body.clean.idle .sets{opacity:0;pointer-events:none}
body.clean.idle{cursor:none}
body.film .ctl,body.film .sets,body.film #fps{display:none!important}
@media (max-width:760px){.ticks i:not(:first-child):not(:last-child){display:none}}
#info{display:none}
@media (max-width:600px){
  #fps,#q,#where,#rec{display:none}
  #info{display:inline-block}
  .read:not(.open) .note,.read:not(.open) .src,.read:not(.open) .more{display:none}
  .note,.meta{font-size:11px}
  h1{font-size:25px}
  button{min-width:54px;padding:9px 8px}
  .ctl{gap:8px}
  .hud{padding-top:28px}
  .sets{top:auto;bottom:118px;left:16px;right:16px;justify-content:center}
  .mark span:last-child{display:none}
}
</style>
</head>
<body>
<canvas id="c" aria-label="A fractal, coloured in shifting psychedelic palettes, zooming between famous places"></canvas>
<div class="mark"><span><b>Psychedelic Mandelbrot</b></span><span></span></div>
<nav class="sets" id="sets" aria-label="Choose a fractal"></nav>
<span id="fps">prototype 2.0</span>
<div class="depth"><span id="mag"></span><span id="iters"></span><span id="where"></span></div>

<div class="hud">
  <div class="inner">
    <div class="read in" id="read">
      <div class="row"><h1 id="title">Psychedelic Mandelbrot</h1><span class="chip exact" id="chip">Exact</span></div>
      <div class="meta row"><span id="place">z → z² + c</span><span class="more" aria-hidden="true">/</span><span class="more" id="scale">the whole set</span></div>
      <p class="note" id="note">Loading the map.</p>
      <p class="src" id="src"></p>
    </div>
    <div class="ctl">
      <button id="play" type="button">Play</button>
      <div class="track">
        <input id="t" type="range" min="0" max="8" step="0.0001" value="0" aria-label="Position in the journey">
        <div class="ticks" id="ticks"></div>
      </div>
      <button id="snd" type="button" aria-pressed="false" title="Sound (M)">Sound</button>
      <button id="txt" type="button" aria-pressed="false" title="Hide or show all text (T)">Text</button>
      <button id="rec" type="button" aria-pressed="false" title="Record a video of the canvas, with sound (R)">Rec</button>
      <button id="info" type="button" aria-pressed="false" title="Show or hide the notes">Info</button>
      <button id="q" type="button" title="Render resolution">Auto</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<div class="fail" id="fail">This prototype needs WebGL2 with float render targets. Open it in a current version of Chrome, Safari, Edge or Firefox.</div>

<script src="audio.js"></script>
<script>
(function(){
"use strict";

// =====================================================================================================
// Shaders
// =====================================================================================================

// ---------- escape-time sets, pass 1: iterate. Perturbation around one reference orbit (computed in JS
// in double precision), with rebasing, so a zoom reaches about 1e-13 without float32 running out of digits.
// One source, three formulas: MANDEL z -> z^2 + c; JULIA the same with c fixed and z0 the pixel;
// SHIP the Burning Ship, z -> (|Re z| + i|Im z|)^2 + c, perturbed with "diffabs".
// Writes per pixel: smooth iteration count (or -1 inside), stripe average (or orbit trap inside),
// distance to the set in pixels, and the angle of the surface normal used for lighting.
var FS_ITER=`#version 300 es
precision highp float;
precision highp int;
//DEFS
uniform highp sampler2D uRef; // reference orbit Z_n, one texel per iteration, 4096 per row
uniform int uRefLen, uMaxIter;
uniform vec2 uRes, uRot;      // render size; rotation as (cos, sin)
uniform float uPix;           // size of one pixel in the complex plane
uniform float uLift;          // pixels the centre sits above the middle, clear of the text panel
out vec4 o;
vec2 cmul(vec2 a,vec2 b){return vec2(a.x*b.x-a.y*b.y,a.x*b.y+a.y*b.x);}
vec2 ref(int i){return texelFetch(uRef,ivec2(i&4095,i>>12),0).xy;}
// |X + x| - |X|, without losing x when X is large
float diffabs(float X,float x){
  if(X>=0.){if(X+x>=0.)return x;return -(2.*X+x);}
  if(X+x>0.)return 2.*X+x;return -x;
}
void main(){
  vec2 p=gl_FragCoord.xy-.5*uRes-vec2(0.,uLift);
  p=vec2(p.x*uRot.x-p.y*uRot.y,p.x*uRot.y+p.y*uRot.x);
#ifdef SHIP
  p.y=-p.y;                   // the ship is drawn the usual way up, keel at the bottom
#endif
  vec2 dc=p*uPix, dz=vec2(0);
  // j0, j1: how z moves as the pixel moves in x and y (times the pixel size, so it stays in range)
  vec2 j0=vec2(0), j1=vec2(0);
#ifdef JULIA
  dz=dc; dc=vec2(0); j0=vec2(uPix,0.); j1=vec2(0.,uPix);
#endif
  vec2 z=ref(0)+dz;
  int m=0, n=0;
  float sum=0., last=0., trap=1e20;
  bool out_=false;
  for(n=0;n<uMaxIter;n++){
    vec2 Z=ref(m);
#ifdef SHIP
    float a=abs(z.x),b=abs(z.y),sx=z.x<0.?-1.:1.,sy=z.y<0.?-1.:1.;
    vec2 fx=vec2(2.*a*sx,2.*b*sx),fy=vec2(-2.*b*sy,2.*a*sy);
    j0=fx*j0.x+fy*j0.y+vec2(uPix,0.);
    j1=fx*j1.x+fy*j1.y+vec2(0.,uPix);
    float A=abs(Z.x),B=abs(Z.y),da=diffabs(Z.x,dz.x),db=diffabs(Z.y,dz.y);
    dz=vec2((2.*A+da)*da-(2.*B+db)*db,2.*(A*db+B*da+da*db))+dc;
#else
  #ifdef JULIA
    j0=2.*cmul(z,j0);
  #else
    j0=2.*cmul(z,j0)+vec2(uPix,0.);
  #endif
    dz=cmul(2.*Z+dz,dz)+dc;
#endif
    m++;
    z=ref(m)+dz;
    float r2=dot(z,z);
    if(r2>1e8){out_=true;break;}
    trap=min(trap,r2);
    // stripe average: a soft texture that follows the flow lines
    last=.5+.5*sin(5.*atan(z.y,z.x));
    sum+=last;
    // rebase when the orbit comes closer to the reference's start than its own offset, or the reference runs out
    vec2 r0=ref(0);
    if(dot(z-r0,z-r0)<dot(dz,dz)||m>=uRefLen-1){dz=z-r0;m=0;}
  }
  if(!out_){o=vec4(-1.,sqrt(sqrt(trap)),0.,0.);return;}
  float lz=log(dot(z,z))*.5;
  float fr=1.-log2(lz/log(1e4));               // fraction past the bailout, 0..1
  float mu=float(n)+fr;
  float cnt=float(n+1);
  float a1=sum/cnt, a0=cnt>1.?(sum-last)/(cnt-1.):a1;
  float stripe=mix(a0,a1,clamp(fr,0.,1.));
#ifdef SHIP
  float dlen=sqrt(.5*(dot(j0,j0)+dot(j1,j1)));
#else
  float dlen=length(j0);
#endif
  float dist=dlen>0.?exp(lz)*lz/dlen:1e4;      // distance estimate, in pixels
  vec2 u=vec2(dot(z,j0),z.y*j0.x-z.x*j0.y);    // z / dz: direction of the surface normal
#ifdef SHIP
  // the folds make angles jump from pixel to pixel: no stripes and no lighting, or the sky turns to checkerboard
  o=vec4(mu,.5,dist,9.);
#else
  o=vec4(mu,stripe,dist,atan(u.y,u.x));
#endif
}`;

// shared colour helpers: two cosine palettes and how far we are from one to the other
var GLSL_PAL=`
uniform vec3 uA[4], uB[4];
uniform float uMix;
const float TAU=6.2831853;
vec3 pal(float x,vec3 a,vec3 b,vec3 c,vec3 d){return a+b*cos(TAU*(c*x+d));}
vec3 palette(float x){return mix(pal(x,uA[0],uA[1],uA[2],uA[3]),pal(x,uB[0],uB[1],uB[2],uB[3]),uMix);}
vec3 finish(vec3 col,vec2 frag,vec2 res){
  // richer than the raw palette: push colours away from grey, then a soft vignette
  float lum=dot(col,vec3(.299,.587,.114));
  col=mix(vec3(lum),col,1.4);
  vec2 q=frag/res-.5;
  col*=1.-.55*dot(q,q);
  return pow(max(col,0.),vec3(.92));
}`;

// ---------- escape-time sets, pass 2: colour. Cheap, runs every frame, so palettes keep flowing at rest.
var FS_COL=`#version 300 es
precision highp float;
uniform highp sampler2D uData;
uniform float uTime, uFlow, uDensity, uLight, uGlow;
uniform vec2 uRes;
out vec4 o;
`+GLSL_PAL+`
void main(){
  vec4 d=texelFetch(uData,ivec2(gl_FragCoord.xy),0);
  vec3 col;
  if(d.x<0.){
    // inside: near-black, lit faintly by how close the orbit came to the centre
    float t=d.y;
    col=palette(t*1.7-uTime*uFlow*.6+.5)*.16*pow(1.-clamp(t,0.,1.),2.)+vec3(.012,.006,.03);
  }else{
    float x=uDensity*sqrt(d.x)-uTime*uFlow+d.y*.32;
    col=palette(x);
    // light falls on the set's "surface" from a slowly circling sun
    vec2 lv=vec2(cos(uLight),sin(uLight));
    float h=d.w>8.?.72:(dot(vec2(cos(d.w),sin(d.w)),lv)+1.4)/2.4;
    col*=.38+.85*h;
    // neon on the filaments: a second, shifted palette colour, brightest closest to the set
    float g=exp(-d.z*.55);
    col=mix(col,palette(x+.5)*1.35+.06,g*uGlow);
    // and a fine dark line right on the boundary, for depth
    col*=mix(.55,1.,smoothstep(0.,.9,d.z));
  }
  o=vec4(finish(col,gl_FragCoord.xy,uRes),1.);
}`;

// ---------- the Mandelbulb: ray-marched with its distance estimate, lit, coloured by an orbit trap
var FS_BULB=`#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uLift, uPower, uTime, uFlow, uDensity, uGlow, uFov;
uniform vec3 uEye, uAt;
out vec4 o;
`+GLSL_PAL+`
float de(vec3 p,out float trap){
  vec3 z=p; float dr=1., r=0.; trap=1e9;
  for(int i=0;i<9;i++){
    r=length(z);
    if(r>2.)break;
    trap=min(trap,r);
    // in spherical coordinates: raise the radius to the power, multiply both angles by it, add the start point
    float th=acos(clamp(z.z/r,-1.,1.))*uPower, ph=atan(z.y,z.x)*uPower;
    dr=pow(r,uPower-1.)*uPower*dr+1.;
    z=pow(r,uPower)*vec3(sin(th)*cos(ph),sin(th)*sin(ph),cos(th))+p;
  }
  return .5*log(max(r,1e-6))*r/dr;
}
float de(vec3 p){float t;return de(p,t);}
void main(){
  vec2 q=(gl_FragCoord.xy-.5*uRes-vec2(0.,uLift))/min(uRes.x,uRes.y);
  vec3 f=normalize(uAt-uEye), r=normalize(cross(f,vec3(0,0,1))), u=cross(r,f);
  vec3 rd=normalize(f+uFov*(q.x*r+q.y*u)), p;
  // the ray starts where it meets the bounding sphere
  float b=dot(uEye,rd), c=dot(uEye,uEye)-1.44, disc=b*b-c, t=0., closest=1e9, trap=1e9;
  bool hit=false; int steps=0;
  if(disc>0.){
    t=max(0.,-b-sqrt(disc));
    float tmax=-b+sqrt(disc);
    for(int i=0;i<180;i++){
      p=uEye+rd*t;
      float d=de(p,trap);
      closest=min(closest,d/max(t,1e-3));
      if(d<.0006*t){hit=true;break;}
      t+=d*.85; steps=i;
      if(t>tmax)break;
    }
  }
  vec3 col;
  if(hit){
    vec2 e=vec2(.0007*t,-.0007*t);
    vec3 n=normalize(e.xyy*de(p+e.xyy)+e.yyx*de(p+e.yyx)+e.yxy*de(p+e.yxy)+e.xxx*de(p+e.xxx));
    // ambient occlusion: how open the surface is, from a few steps along the normal
    float ao=0.;
    for(int k=1;k<=4;k++){float h=.012*float(k*k);ao+=(h-de(p+n*h))/h/float(k);}
    ao=clamp(1.-ao*.55,0.,1.);
    vec3 L=normalize(vec3(.6,-.5,.9));
    float dif=max(dot(n,L),0.), rim=pow(1.-max(dot(n,-rd),0.),3.);
    float x=uDensity*trap*4.-uTime*uFlow+float(steps)*.004;
    vec3 base=palette(x);

// The Buddhabrot tracer. The same function runs in a worker (normally) or on the page, a fixed amount
// per frame (when filming, so every frame of a film is the same however fast the machine is)
// =====================================================================================================
function buddhaTracer(){

  }

    var dx=x-st.re,dy=y-st.im,u=(dx*st.cos+dy*st.sin)/st.pix,v=(-dx*st.sin+dy*st.cos)/st.pix;
    var px=Math.floor(st.w/2+u),py=Math.floor(st.h/2+v+st.lift);
    if(px<0||py<0||px>=st.w||py>=st.h)return;
    var i=(py*st.w+px)*4,l=st.limits;

    if(!st)return;

      var cr=rnd()*3.2-2.15,ci=rnd()*3.2-1.6;
      // skip the two largest regions inside the set: their orbits never escape
      var q=(cr-.25)*(cr-.25)+ci*ci;
      if(q*(q+(cr-.25))<.25*ci*ci||(cr+1)*(cr+1)+ci*ci<.0625)continue;
      var x=0,y=0,k=0,esc=false;
      for(k=1;k<=L;k++){
        var t=x*x-y*y+cr;y=2*x*y+ci;x=t;ox[k]=x;oy[k]=y;
        if(x*x+y*y>4){esc=true;break;}
      }

      st.traced++;
      // the mirror image is a valid path too (c's conjugate traces it), so each orbit is drawn twice
      for(var j=2;j<k;j++){plot(ox[j],oy[j],k);plot(ox[j],-oy[j],k);}

    }

  }

}

    read.style.setProperty("--note-at",noteAt.toFixed(2)+"s");read.style.setProperty("--src-at",srcAt.toFixed(2)+"s");
    var chip=document.getElementById("chip");chip.textContent=LABELS[e.label];chip.className="chip "+e.label;
    document.getElementById("place").textContent=e.place;
    document.getElementById("scale").textContent=e.scale;
    var h=document.getElementById("title");
    h.style.setProperty("--p0",palColour(e.palette,.1));h.style.setProperty("--p1",palColour(e.palette,.43));h.style.setProperty("--p2",palColour(e.palette,.76));
    words(document.getElementById("note"),e.note);
    var src=document.getElementById("src");src.textContent="";
    e.sources.forEach(function(id,k){
      var so=SOURCES[id];if(!so)return;
      src.appendChild(document.createTextNode(k?" · ":"Checked by: "));
      var a=document.createElement("a");a.href=so.url;a.target="_blank";a.rel="noopener";a.textContent=so.publisher;a.title=so.title;src.appendChild(a);
    });
    read.classList.remove("out");void read.offsetWidth;
    requestAnimationFrame(function(){requestAnimationFrame(function(){read.classList.add("in");});});
  },wait);
}
// keep the panel one height, measured against the longest stage text in any set
var hudEl=document.querySelector(".hud");
function reserveText(){
  if(!SETS.length)return;
  var m=read.cloneNode(true);m.removeAttribute("id");m.className="read in measure"+(read.classList.contains("open")?" open":"");
  m.querySelectorAll("[id]").forEach(function(el){el.removeAttribute("id");});
  read.parentNode.style.position="relative";read.parentNode.appendChild(m);
  var tallest=0;
  SETS.forEach(function(set){set.stages.forEach(function(e){
    m.querySelector("h1").textContent=e.title;m.querySelector(".chip").textContent=LABELS[e.label];
    var sp=m.querySelectorAll(".meta span");sp[0].textContent=e.place;sp[2].textContent=e.scale;
    m.querySelector(".note").textContent=e.note;
    m.querySelector(".src").textContent="Checked by: "+e.sources.map(function(id){return SOURCES[id]?SOURCES[id].publisher:"";}).join(" · ");
    tallest=Math.max(tallest,m.offsetHeight);
  });});
  m.remove();read.style.minHeight=Math.ceil(tallest)+"px";
  measureLift();
}
var lift=0;
// the picture's centre sits a little above the middle, clear of the text panel (not in no-text mode)
function measureLift(){
  var want=document.body.classList.contains("clean")?0:Math.min(.22,Math.max(0,(hudEl.offsetHeight-60)/Math.max(1,canvas.clientHeight)/2.6));
  if(want!==lift){lift=want;dirty=true;if(SET&&SET.kind==="buddha")buddha.key="";}
}
var reserveTimer=0;
window.addEventListener("resize",function(){clearTimeout(reserveTimer);reserveTimer=setTimeout(reserveText,150);dirty=true;});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(reserveText);

// =====================================================================================================
// Controls
// =====================================================================================================
function dwell(i){var e=STAGES[i];return e?(SET.kind==="buddha"?9:6)+e.note.split(" ").length*.28:5;}
var wakeLock=null;
function holdScreen(){
  if(wakeLock||!("wakeLock" in navigator))return;
  navigator.wakeLock.request("screen").then(function(l){wakeLock=l;l.addEventListener("release",function(){wakeLock=null;});if(!playing)releaseScreen();}).catch(function(){});
}
function releaseScreen(){if(wakeLock){wakeLock.release().catch(function(){});wakeLock=null;}}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&playing)holdScreen();});
function stop(){playing=false;phase="moving";playBtn.textContent="Play";releaseScreen();}
function setT(v,fromSlider){
  // the journey is a loop: past the last stage it pulls back out and starts again
  T=((v%LAST)+LAST)%LAST;
  if(!fromSlider)slider.value=T;
}
var glideTo=null;
slider.addEventListener("input",function(){stop();glideTo=null;setT(parseFloat(slider.value),true);});
slider.addEventListener("change",function(){var r=Math.round(T);if(Math.abs(T-r)<.08)glideTo=r;});
function toggle(){
  if(playing){stop();return;}
  playing=true;playBtn.textContent="Pause";holdScreen();
  var r=Math.round(T)%LAST;
  if(Math.abs(T-Math.round(T))<.01){setT(r);phase="holding";hold=textStage===r?2.5:dwell(r);}
  else phase="moving";
}
playBtn.addEventListener("click",toggle);
var infoBtn=document.getElementById("info");
infoBtn.addEventListener("click",function(){
  var open=read.classList.toggle("open");
  infoBtn.textContent=open?"Less":"Info";infoBtn.setAttribute("aria-pressed",String(open));reserveText();
});

// no-text mode: only the picture; the controls fade away until the pointer moves
var txtBtn=document.getElementById("txt"),idleTimer=0;
function setClean(on){
  document.body.classList.toggle("clean",on);
  txtBtn.setAttribute("aria-pressed",String(on));txtBtn.textContent=on?"No text":"Text";
  measureLift();poke();
}
function poke(){
  document.body.classList.remove("idle");clearTimeout(idleTimer);
  if(document.body.classList.contains("clean"))idleTimer=setTimeout(function(){document.body.classList.add("idle");},2500);
}
txtBtn.addEventListener("click",function(){setClean(!document.body.classList.contains("clean"));});
["pointermove","pointerdown","keydown"].forEach(function(ev){window.addEventListener(ev,poke,{passive:true});});
if(/[?&]clean/.test(Q))setClean(true);
if(FILM)document.body.classList.add("film");

// sound: one output that feeds the speakers and, while recording, the video
var sndBtn=document.getElementById("snd"),AC=null,SND=null,soundOn=false,soundOut=null,recDest=null;
function ensureAudio(){
  if(AC)return;
  var Ctx=window.AudioContext||window.webkitAudioContext;try{AC=new Ctx({latencyHint:"playback"});}catch(e){AC=new Ctx();}
  soundOut=AC.createGain();soundOut.connect(AC.destination);
  SND=createSoundtrack(AC,soundOut,STAGES.map(function(s){return s.sound;}));
}
sndBtn.addEventListener("click",function(){
  try{
    ensureAudio();
    soundOn=!soundOn;
    if(soundOn)AC.resume();
    SND.setOn(soundOn);
    if(!soundOn&&!recorder)setTimeout(function(){if(!soundOn&&!recorder)AC.suspend();},1200);
    sndBtn.textContent=soundOn?"Mute":"Sound";sndBtn.setAttribute("aria-pressed",String(soundOn));
  }catch(err){console.error(err);sndBtn.textContent="No sound";sndBtn.disabled=true;}
});
document.addEventListener("visibilitychange",function(){if(!AC||recorder)return;if(document.hidden)AC.suspend();else if(soundOn)AC.resume();});

// the recorder: the canvas (no text) and the soundtrack, in real time, straight to a video file.
// For films without dropped frames, and with the text, use tools/film.mjs.
var recBtn=document.getElementById("rec"),recorder=null,recChunks=[],toast=document.getElementById("toast");
function showToast(html){toast.innerHTML=html;toast.classList.add("show");}
toast.addEventListener("click",function(e){if(e.target.dataset.close!==undefined){toast.classList.remove("show");toast.innerHTML="";}});
function recType(){
  var types=["video/mp4;codecs=avc1.640028,mp4a.40.2","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm"];
  for(var i=0;i<types.length;i++)if(window.MediaRecorder&&MediaRecorder.isTypeSupported(types[i]))return types[i];
  return "";
}
// Saving: inside claude.ai the viewer's own save prompt (the downloads capability); anywhere else, a plain download
var downloadsCap=null;
if(window.claude&&window.claude.use)window.claude.use("downloads").then(function(d){downloadsCap=d;}).catch(function(){});
function saveVideo(blob,url,name){
  var out=document.getElementById("saved");
  if(downloadsCap){
    downloadsCap.save({filename:name,data:blob}).then(function(){out.textContent="Saved "+name+".";})
      .catch(function(e){out.textContent=e&&e.code==="declined"?"Not saved.":"This view cannot save files"+(e&&e.code?" ("+e.code+")":"")+".";});
    return;
  }
  var a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  out.textContent="Saving "+name+". If nothing happens, this view blocks downloads: open the page from its GitHub Pages address.";
}
recBtn.addEventListener("click",function(){
  if(recorder){recorder.stop();return;}
  if(!window.MediaRecorder||!canvas.captureStream){showToast('<p>This browser cannot record video. Try a current Chrome, Edge, Firefox or Safari, or use <code>tools/film.mjs</code>.</p><div class="row"><button type="button" data-close>Close</button></div>');return;}
  var stream=canvas.captureStream(FILM?0:60);
  if(soundOn&&AC){
    if(!recDest){recDest=AC.createMediaStreamDestination();soundOut.connect(recDest);}
    recDest.stream.getAudioTracks().forEach(function(t){stream.addTrack(t);});
  }
  var type=recType();
  try{recorder=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:24e6}:{});}
  catch(e){recorder=new MediaRecorder(stream);}
  recChunks=[];
  recorder.ondataavailable=function(e){if(e.data&&e.data.size)recChunks.push(e.data);};
  recorder.onstop=function(){
    var mime=recorder.mimeType||type||"video/webm",ext=/mp4/.test(mime)?"mp4":"webm";
    var blob=new Blob(recChunks,{type:mime}),url=URL.createObjectURL(blob);
    var name="psychedelic-"+SET.id+"-"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+"."+ext;
    recorder=null;recBtn.classList.remove("on");recBtn.textContent="Rec";recBtn.setAttribute("aria-pressed","false");
    showToast('<video src="'+url+'" controls playsinline></video><p>'+(blob.size/1048576).toFixed(1)+' MB, '+ext.toUpperCase()+
      (soundOn?', with sound.':', silent (turn Sound on before recording to include it).')+
      '</p><p id="saved"></p><div class="row"><button type="button" id="save">Save video</button><button type="button" data-close>Close</button></div>');
    document.getElementById("save").addEventListener("click",function(){saveVideo(blob,url,name);});
  };
  recorder.start(1000);
  recBtn.classList.add("on");recBtn.textContent="Stop";recBtn.setAttribute("aria-pressed","true");
});

window.addEventListener("keydown",function(e){
  if(e.target===slider||e.metaKey||e.ctrlKey)return;
  if(e.code==="Space"){e.preventDefault();toggle();}
  else if(e.code==="KeyM")sndBtn.click();
  else if(e.code==="KeyT")txtBtn.click();
  else if(e.code==="KeyR")recBtn.click();
  else if(e.code==="ArrowRight"){stop();setT(T+.01);}
  else if(e.code==="ArrowLeft"){stop();setT(T-.01);}
});

// =====================================================================================================
// Sets
// =====================================================================================================
var setsNav=document.getElementById("sets");
function useSet(id,stageAt){
  var set=SETS.filter(function(s){return s.id===id;})[0]||SETS[0];
  if(SET&&SET.id===set.id&&stageAt===undefined)return;
  var wasPlaying=playing;stop();
  if(SET&&SET.kind==="buddha"&&set.kind!=="buddha")buddhaStop();
  SET=set;STAGES=set.stages;LAST=STAGES.length;slider.max=LAST;
  HOME={re:STAGES[0].re,im:STAGES[0].im,span:STAGES[0].span};
  var ticks=document.getElementById("ticks");ticks.textContent="";
  STAGES.forEach(function(e){var i=document.createElement("i");i.textContent=e.tick;ticks.appendChild(i);});
  var i=document.createElement("i");i.textContent="↺";ticks.appendChild(i);
  Array.prototype.forEach.call(setsNav.children,function(b){b.setAttribute("aria-pressed",String(b.dataset.id===set.id));});
  document.querySelector(".mark b").textContent="Psychedelic "+set.name;
  if(SND)SND.setVoices(STAGES.map(function(s){return s.sound;}));
  textStage=-2;buddha.key="";
  setT(stageAt||0);dirty=true;
  if(wasPlaying)toggle();
  try{history.replaceState(null,"","#"+(stageAt?set.id+"-"+STAGES[Math.round(stageAt)%LAST].id:set.id));}catch(e){}
}

// =====================================================================================================
// Drawing
// =====================================================================================================
var dirty=true,lastKey="",time=0,clockFrozen=/[?&]still/.test(Q);
var magEl=document.getElementById("mag"),itEl=document.getElementById("iters"),whereEl=document.getElementById("where");
var lightA=.7,frameMs=16,slowFor=0,fastFor=0;
function adaptResolution(dt,moving){
  if(SCALES[qi]||FIXED||recorder||FILM)return;
  // judged over a couple of seconds, and applied only while the view rests or between stages
  if(frameMs>42){slowFor+=dt;fastFor=0;}else if(frameMs<19){fastFor+=dt;slowFor=0;}else{slowFor=fastFor=0;}
  var atRest=!moving||(STAGES.length&&Math.abs(T-Math.round(T))<.002);
  if(!atRest&&SET.kind!=="bulb")return;
  if(slowFor>1.5){autoScale=Math.max(.3,autoScale*.85);slowFor=0;}
  else if(fastFor>3){autoScale=Math.min(coarse?.75:1,autoScale*1.1);fastFor=0;}
}
function setPalettes(P,C){
  gl.uniform3fv(P.u.uA,flat(C.pa));gl.uniform3fv(P.u.uB,flat(C.pb));gl.uniform1f(P.u.uMix,C.mix);
}
function draw(C){
  var sz=wantSize();
  if(sz[0]!==W||sz[1]!==H){sizeTargets(sz[0],sz[1]);dirty=true;buddha.key="";}
  gl.viewport(0,0,W,H);
  if(C.kind==="escape"){
    var key=[SET.id,C.re,C.im,C.span,C.rot,C.iter,C.kr,C.ki,W,H,lift].join(",");
    if(dirty||key!==lastKey){
      var len=referenceOrbit(C.formula,C.re,C.im,C.kr,C.ki,C.iter);
      var P=program(C.formula);
      gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
      gl.useProgram(P.p);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,refTex);gl.uniform1i(P.u.uRef,0);
      gl.uniform1i(P.u.uRefLen,len);gl.uniform1i(P.u.uMaxIter,C.iter);
      gl.uniform2f(P.u.uRes,W,H);gl.uniform2f(P.u.uRot,Math.cos(C.rot),Math.sin(C.rot));
      gl.uniform1f(P.u.uPix,C.span/Math.min(W,H));gl.uniform1f(P.u.uLift,lift*H);
      gl.drawArrays(gl.TRIANGLES,0,3);
      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      lastKey=key;dirty=false;
    }
    var K=program("colour");
    gl.useProgram(K.p);
    gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,dataTex);gl.uniform1i(K.u.uData,1);
    setPalettes(K,C);
    gl.uniform1f(K.u.uTime,time);gl.uniform1f(K.u.uFlow,C.flow);gl.uniform1f(K.u.uDensity,C.density);gl.uniform1f(K.u.uGlow,C.glow);
    gl.uniform1f(K.u.uLight,lightA);gl.uniform2f(K.u.uRes,W,H);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }else if(C.kind==="bulb"){
    var B=program("bulb");gl.useProgram(B.p);
    var yaw=(C.yaw+time*2.2)*Math.PI/180,pitch=C.pitch*Math.PI/180;
    var eye=[C.at[0]+C.dist*Math.cos(pitch)*Math.cos(yaw),C.at[1]+C.dist*Math.cos(pitch)*Math.sin(yaw),C.at[2]+C.dist*Math.sin(pitch)];
    gl.uniform3fv(B.u.uEye,eye);gl.uniform3fv(B.u.uAt,C.at);
    gl.uniform1f(B.u.uPower,C.power);gl.uniform1f(B.u.uFov,C.fov);
    setPalettes(B,C);
    gl.uniform1f(B.u.uTime,time);gl.uniform1f(B.u.uFlow,C.flow);gl.uniform1f(B.u.uDensity,C.density);gl.uniform1f(B.u.uGlow,C.glow);
    gl.uniform2f(B.u.uRes,W,H);gl.uniform1f(B.u.uLift,lift*H);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }else{
    var bkey=[SET.id,C.stage,W,H,lift].join(",");
    if(bkey!==buddha.key){buddha.key=bkey;buddhaStart(C);}
    if(buddha.local&&(FILM||!buddha.worker))buddhaLocalStep();
    var D=program("buddha");gl.useProgram(D.p);
    gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,buddha.tex);gl.uniform1i(D.u.uHist,2);
    gl.uniform2f(D.u.uRes,W,H);gl.uniform2f(D.u.uHistSize,buddha.w,buddha.h);
    gl.uniform3f(D.u.uNorm,1/buddha.levels[0],1/buddha.levels[1],1/buddha.levels[2]);
    setPalettes(D,C);
    // a new picture brightens in over its first moments, while it is still grainy
    gl.uniform1f(D.u.uTime,time);gl.uniform1f(D.u.uFlow,C.flow);gl.uniform1f(D.u.uGlow,C.glow);gl.uniform1f(D.u.uFade,C.fade);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
}

function hud(C){
  if(C.kind==="escape"){
    magEl.textContent="magnification "+mag(C.span);
    itEl.textContent=C.iter.toLocaleString("en-GB")+" iterations per point";
    var dp=Math.max(4,Math.ceil(-Math.log10(C.span))+3);
    whereEl.textContent=(SET.formula==="julia"?"k = "+C.kr.toFixed(4)+(C.ki<0?" − ":" + ")+Math.abs(C.ki).toFixed(4)+"i · ":"c = ")+
      (SET.formula==="julia"?"z = ":"")+C.re.toFixed(dp)+(C.im<0?" − ":" + ")+Math.abs(C.im).toFixed(dp)+"i";
  }else if(C.kind==="bulb"){
    magEl.textContent="power "+C.power.toFixed(2);
    itEl.textContent="camera "+C.dist.toFixed(3)+" from the centre";
    whereEl.textContent="9 iterations per step, up to 180 steps per ray";
  }else{
    magEl.textContent=Math.round(buddha.traced*2).toLocaleString("en-GB")+" paths traced";
    itEl.textContent="limits "+C.limits.map(function(l){return l.toLocaleString("en-GB");}).join(" / ")+" (red / green / blue)";
    whereEl.textContent="";
  }
}

function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+" "+r.status);return r.json();});}
Promise.all([getJSON("data/sets.json"),getJSON("data/sources.json")]).then(function(d){
  SETS=d[0].sets;
  SETS.forEach(function(s){s.stages.sort(function(a,b){return a.stage-b.stage;});});
  d[1].sources.forEach(function(so){SOURCES[so.id]=so;});
  SETS.forEach(function(s){
    var b=document.createElement("button");b.type="button";b.textContent=s.name;b.dataset.id=s.id;
    b.addEventListener("click",function(){useSet(s.id);});setsNav.appendChild(b);
  });
  reserveText();
  // where to start: #julia, #julia-rabbit, #seahorse (a Mandelbrot stage), or ?set=ship&at=2.5
  var h=decodeURIComponent((location.hash||"").replace("#","")).toLowerCase(),setId=SETS[0].id,at=0;
  var qs=/[?&]set=([\w-]+)/.exec(Q);if(qs)setId=qs[1];
  SETS.forEach(function(s){
    if(h===s.id)setId=s.id;
    s.stages.forEach(function(e,k){if(h===s.id+"-"+e.id||(s===SETS[0]&&h===e.id)){setId=s.id;at=k;}});
  });
  var qa=/[?&]at=([\d.]+)/.exec(Q);if(qa)at=parseFloat(qa[1]);
  // for finding new places: ?set=ship&at=1&re=-1.76&im=-0.03&span=0.01 overrides that stage's view
  ["re","im","span","kre","kim","turn"].forEach(function(f){var m=new RegExp("[?&]"+f+"=(-?[\\d.e-]+)").exec(Q);
    if(m)SETS.forEach(function(s){if(s.id===setId&&s.stages[Math.round(at)])s.stages[Math.round(at)][f]=parseFloat(m[1]);});});
  useSet(setId,at);
  if(/[?&]autoplay/.test(Q))toggle();
}).catch(function(err){
  console.error(err);
  document.getElementById("note").textContent="The map could not be loaded, so the journey cannot run. Serve the folder over HTTP (npm run serve).";
});

var last=performance.now(),frames=0,acc=0,fpsEl=document.getElementById("fps"),hudTick=0;
function frame(now){
  frameMs=frameMs*.9+(now-last)*.1;
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(!clockFrozen){time+=dt;lightA+=dt*.05;}
  if(glideTo!==null){
    if(playing)glideTo=null;
    else{var gd=glideTo-T;if(Math.abs(gd)<.0005){setT(glideTo);glideTo=null;}else setT(T+gd*Math.min(1,dt*4));}
  }
  var moving=false;
  if(playing&&STAGES.length){
    if(phase==="holding"){hold-=dt;if(hold<=0){phase="leaving";hold=TEXT_OUT/1000+.3;}}
    else if(phase==="leaving"){hold-=dt;if(hold<=0)phase="moving";}
    else{
      moving=true;
      var k0=Math.floor(T+1e-9),nt=T+dt/legOf(k0).secs;
      if(nt>=k0+1){nt=k0+1;phase="holding";hold=dwell((k0+1)%LAST);}
      progress+=nt-T;
      setT(nt);
    }
  }
  if(STAGES.length){
    var near=Math.round(T)%LAST;
    if(playing?phase==="holding":Math.abs(T-Math.round(T))<.01)showText(near);else hideText();
  }
  if(SET){
    var C=camAt(T);
    adaptResolution(dt,moving);
    draw(C);
    if(SND&&soundOn)SND.update(T,C);
    hudTick+=dt;
    if(hudTick>.1){hudTick=0;hud(C);}
    window.__mandel.span=C.span;
  }
  frames++;acc+=dt;
  if(acc>=1){fpsEl.textContent="prototype 2.0 / "+Math.round(frames/acc)+" fps / "+W+"×"+H;frames=0;acc=0;}
  requestAnimationFrame(frame);
}
window.__mandel={camAt:camAt,setT:setT,useSet:useSet,get T(){return T;},get progress(){return progress;},get phase(){return phase;},
  get playing(){return playing;},get set(){return SET&&SET.id;},stages:function(){return STAGES;},span:0};
requestAnimationFrame(frame);
})();
